name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-build.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # ---- Build Android APK ----
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
          cache-disabled: true

      - name: Build Debug APK
        working-directory: apps/android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: china-study-free-android
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload to Release (main 分支 → android-latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android APK (auto build)
          body: |
            自动构建的 Android APK，基于最新 main 分支。

            使用方法：
            1. 下载并安装到手机（需开启"安装未知来源应用"）
            2. 首次打开填写你部署的容器地址（如 http://192.168.1.100:5230）
            3. 点击连接即可使用

            小技巧：三击屏幕左上角可重新设置服务器地址
          files: apps/android/app/build/outputs/apk/debug/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to Release (tag → 对应版本 Release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            版本 ${{ github.ref_name }}

            包含 Android APK 和 Docker 镜像（ghcr.io/pelico/chinatextbookstudyfree:${{ github.ref_name }}）。

            **Android APK 使用方法：**
            1. 下载并安装到手机（需开启"安装未知来源应用"）
            2. 首次打开填写你部署的容器地址（如 http://192.168.1.100:5230）
            3. 点击连接即可使用

            小技巧：三击屏幕左上角可重新设置服务器地址
          files: apps/android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
