name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - 'scripts/**/*.py'
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lowercase image name
        id: image
        run: echo "name=$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.title=ChinaStudyFree
            org.opencontainers.image.description=小学全科 AI 学习平台
            org.opencontainers.image.licenses=MIT

      - name: Pre-download data.zip
        run: |
          mkdir -p data
          curl -sL "https://github.com/${{ github.repository }}/releases/download/v1.1.0-assets/data.zip" -o data/data.zip
          if [ -s data/data.zip ] && python3 -c "import zipfile; zipfile.ZipFile('data/data.zip')" 2>/dev/null; then
            echo "data.zip downloaded OK ($(du -h data/data.zip | cut -f1))"
          else
            echo "WARNING: data.zip download failed or invalid"
            rm -f data/data.zip
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SKIP_ASSETS=true
          cache-from: type=gha
          cache-to: type=gha,mode=max
