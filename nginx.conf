server {
    listen 80;
    server_name _;
    client_max_body_size 100m;

    # 相对路径重定向：避免 Docker 端口映射时丢失端口号
    # （nginx 在容器内监听 80 端口，但外部访问可能是 5231 等其他端口）
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/xhtml+xml
        image/svg+xml;

    # ---- MIME 类型（包含标准类型 + Opus 音频）----
    include /etc/nginx/mime.types;
    types {
        audio/ogg opus;
    }

    # ---- 静态资源缓存 ----
    location ~* \.(opus|ogg|jpg|jpeg|png|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # ---- JSON 数据 ----
    location ~* \.json$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # ---- 重试 API（内部 nc 服务）----
    location /api/retry {
        proxy_pass http://127.0.0.1:18080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- 自定义学习 API（Python SQLite 服务）----
    location /api/custom/ {
        proxy_pass http://127.0.0.1:18081/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 600s;
    }

    # ---- 自定义教材图片（通过 symlink: /usr/share/nginx/html/custom-images → /data/images/）----
    location ^~ /custom-images/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # ---- 自定义学习页面（客户端路由，fallback 到 index.html）----
    location /custom/ {
        try_files $uri $uri/ /custom/index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # ---- Service Worker：不缓存，确保每次拉取最新版 ----
    location = /sw.js {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- HTML 文件：不缓存，确保更新后即时生效 ----
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- 资源状态文件（不缓存，实时刷新）----
    location = /assets-status.json {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- Next.js 静态导出路由 ----
    # output:"export" + trailingSlash:true 生成 /path/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # ---- 安全头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: blob:; worker-src 'self' blob:;" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
}
