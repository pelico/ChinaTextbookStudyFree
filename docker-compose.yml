services:
  web:
    image: ghcr.io/pelico/chinatextbookstudyfree:latest
    container_name: china-study-free
    ports:
      - "${PORT:-3000}:80"
    restart: unless-stopped
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
    volumes:
      - /mnt/wanos/sda1-wky/docker/cnstudy/audio:/usr/share/nginx/html/audio
      - /mnt/wanos/sda1-wky/docker/cnstudy/textbook-pages:/usr/share/nginx/html/textbook-pages
      - /mnt/wanos/sda1-wky/docker/cnstudy/story-images:/usr/share/nginx/html/story-images
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
